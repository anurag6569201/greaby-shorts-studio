<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Creation is Ready!</title>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol'; margin: 0; padding: 0; background-color: #f8fafc;">
    <div style="max-width: 600px; margin: 40px auto; background-color: #ffffff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1); border-top: 4px solid #2563eb;">
        <h1 style="color: #1e293b; font-size: 28px; margin-top: 0;">Your {{ creation_type }} is ready!</h1>
        <p style="font-size: 16px; line-height: 1.6; color: #475569;">
            Great news! Your {{ creation_type | lower }} generation for the following prompt has been successfully completed:
        </p>
        <div style="margin: 30px 0; padding: 20px; background-color: #f1f5f9; border-radius: 8px; font-style: italic; color: #475569;">
            "{{ prompt }}"
        </div>
        <p style="font-size: 16px; line-height: 1.6; color: #475569;">
            You can now view and download it from your library in the dashboard.
        </p>
        <div style="text-align: center; margin-top: 30px;">
            <a href="{{ dashboard_url }}" style="display: inline-block; padding: 14px 28px; background-color: #6d28d9; color: white; text-decoration: none; border-radius: 8px; font-weight: 600;">View in My Library</a>
        </div>
        <hr style="border: none; border-top: 1px solid #e2e8f0; margin: 40px 0;">
        <p style="font-size: 12px; text-align: center; color: #94a3b8;">
            Keep up the great work!<br>— The Greaby Team
        </p>
    </div>
</body>
</html>
