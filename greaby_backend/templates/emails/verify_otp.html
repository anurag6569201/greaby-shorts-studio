<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Greaby Verification Code</title>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol'; margin: 0; padding: 0;">
    <div style="max-width: 600px; margin: 40px auto; background-color: #ffffff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1); border-top: 4px solid #6d28d9;">
        <h1 style="color: #1e293b; font-size: 28px; margin-top: 0; text-align: center;">One last step...</h1>
        <p style="font-size: 16px; line-height: 1.6; color: #475569; text-align: center;">
            Hi {{ first_name }}, please use the following code to verify your email address and activate your Greaby account.
        </p>
        <div style="font-size: 42px; font-weight: 700; letter-spacing: 8px; margin: 30px 0; padding: 20px; background-color: #f1f5f9; border-radius: 8px; text-align: center; color: #1e293b;">
            {{ otp_code }}
        </div>
        <p style="text-align: center; font-size: 14px; color: #64748b;">
            This code will expire in 10 minutes.
        </p>
        <hr style="border: none; border-top: 1px solid #e2e8f0; margin: 30px 0;">
        <p style="font-size: 12px; text-align: center; color: #94a3b8;">
            If you did not sign up for Greaby, please ignore this email.
        </p>
        <hr style="border: none; border-top: 1px solid #e2e8f0; margin: 40px 0;">
        <p style="font-size: 12px; text-align: center; color: #94a3b8;">
            Keep up the great work!<br>— The Greaby Team
        </p>
    </div>
</body>
</html>
