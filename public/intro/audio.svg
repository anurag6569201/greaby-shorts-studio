<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <!-- 
      This filter creates the blur effect.
      The 'stdDeviation' value controls the amount of blur.
      A higher value creates a softer, more spread-out effect.
    -->
    <filter id="soft-blur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="80" result="blurred" />
    </filter>
  </defs>

  <!-- This group applies the blur filter to all shapes inside it -->
  <g filter="url(#soft-blur)">
    <!-- 
      These are the colored shapes that get blurred together.
      - 'cx' and 'cy' set the position of the circle's center.
      - 'r' sets the radius (size).
      - 'fill' sets the color.
    -->
    <circle cx="150" cy="150" r="150" fill="#a855f7" /> <!-- Purple -->
    <circle cx="350" cy="180" r="160" fill="#34d399" /> <!-- Green/Teal -->
    <circle cx="180" cy="380" r="140" fill="#60a5fa" /> <!-- Blue -->
    <circle cx="400" cy="400" r="120" fill="#fdbf6f" /> <!-- Light Orange/Peach -->
  </g>
</svg>