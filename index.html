<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Charset & Viewport -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Greaby: AI Voice Generator, Transcription & Translation</title>
    <meta
      name="description"
      content="Generate lifelike AI voices with 98+ realistic options, automated SRT transcriptions, and document translations. Start creating for free with Greaby!"
    />
    <meta name="keywords" content="AI voice generator, speech to text, transcription, document translator, text to speech, lifelike voices, Greaby, SRT subtitle, AI transcription, TTS online" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Greaby Team" />
    <link rel="canonical" href="https://greaby.cloud" />

    <!-- OpenGraph Tags -->
    <meta property="og:title" content="Greaby: AI Voice Generator, Transcription & Translation" />
    <meta property="og:description" content="Generate lifelike AI voices, flawless SRT transcriptions, and instantly translate documents with powerful AI tools." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://greaby.cloud" />
    <meta property="og:image" content="https://greaby.cloud/og-image.png" />

    <!-- Twitter Card Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Greaby: AI Voice Generator, Transcription & Translation" />
    <meta name="twitter:description" content="99+ voices, realistic TTS, subtitle generation and document translation — all powered by AI." />
    <meta name="twitter:image" content="https://greaby.cloud/og-image.png" />
    <meta name="twitter:site" content="@anurag6569201" />

    <!-- Icons / Manifest -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Rich Search Schema -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "Greaby",
            "url": "https://greaby.cloud",
            "logo": "https://greaby.cloud/logo.png",
            "sameAs": ["https://twitter.com/anurag6569201"]
          },
          {
            "@type": "WebSite",
            "url": "https://greaby.cloud",
            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://greaby.cloud/search?q={search_term_string}"
              },
              "query-input": "required name=search_term_string"
            }
          },
          {
            "@type": "SoftwareApplication",
            "name": "Greaby",
            "operatingSystem": "Web-based",
            "applicationCategory": "MultimediaApplication",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            }
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "What are credits and how do they work?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Credits are our pay-as-you-go currency. You buy a pack, and each feature (voice, transcription, translation) deducts the required credits."
                }
              },
              {
                "@type": "Question",
                "name": "What tools does Greaby offer?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "We offer text-to-speech, audio/video transcription, SRT generation, and document translation — all powered by AI."
                }
              }
            ]
          }
        ]
      }
    </script>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-C6MYB2NGY5"></script>

      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-C6MYB2NGY5");
    </script>
  </head>
